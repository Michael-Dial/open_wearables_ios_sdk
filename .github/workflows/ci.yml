name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
  workflow_dispatch:

# One run per commit: a push to a branch with an open PR starts both a push and a
# pull_request run, and hosted macOS runners are scarce enough that four queued
# macOS jobs per commit left most of them cancelled before a runner picked them up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build and test share one macOS job so each commit waits for a single runner.
  build-and-test:
    name: Build and test (iOS)
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build framework for iOS (device SDK)
        run: |
          xcodebuild build \
            -project OpenWearablesHealthSDK.xcodeproj \
            -scheme OpenWearablesHealthSDK \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Pick newest iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | .value[] | select(.isAvailable) | .name' \
            | grep -i iphone | tail -1)
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project OpenWearablesHealthSDK.xcodeproj \
            -scheme OpenWearablesHealthSDK \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
            CODE_SIGNING_ALLOWED=NO
