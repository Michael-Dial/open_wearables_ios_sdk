name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
  workflow_dispatch:

# One run per commit: a push to a branch with an open PR starts both a push and a
# pull_request run, and hosted macOS runners are scarce enough that four queued
# macOS jobs per commit left most of them cancelled before a runner picked them up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build and test share one macOS job so each commit waits for a single runner.
  build-and-test:
    name: Build and test (iOS)
    # The org's self-hosted Mac. The repo is public, so pull requests from forks never
    # run here: their code would execute on that machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Each run builds into its own DerivedData and tests on its own simulator, so two
      # runners on the same Mac never share a build folder or boot the same device.
      - name: Build framework for iOS (device SDK)
        run: |
          xcodebuild build \
            -project OpenWearablesHealthSDK.xcodeproj \
            -scheme OpenWearablesHealthSDK \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Create a simulator for this run
        run: |
          RUNTIMES=$(xcrun simctl list runtimes available -j)
          RUNTIME=$(echo "$RUNTIMES" | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last | .identifier')
          DEVICE_TYPE=$(echo "$RUNTIMES" | jq -r --arg r "$RUNTIME" \
            '.runtimes[] | select(.identifier == $r) | [.supportedDeviceTypes[] | select(.productFamily == "iPhone")] | last | .identifier')
          SIM_UDID=$(xcrun simctl create "ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$DEVICE_TYPE" "$RUNTIME")
          echo "Created $SIM_UDID ($DEVICE_TYPE, $RUNTIME)"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project OpenWearablesHealthSDK.xcodeproj \
            -scheme OpenWearablesHealthSDK \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Delete this run's simulator
        if: always() && env.SIM_UDID != ''
        run: |
          xcrun simctl shutdown "$SIM_UDID" || true
          xcrun simctl delete "$SIM_UDID"
